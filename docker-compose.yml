version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: back2u-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: back2u
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back2u-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:localpassword@postgres:5432/back2u
      - ML_SERVICE_URL=http://host.docker.internal:8001
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: back2u-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
